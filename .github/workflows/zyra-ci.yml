name: ZYRA CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * *'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select Flutter tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      tests: ${{ steps.scope.outputs.tests }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
          # Only checkout-tree blobs are needed by the test selector.
          filter: blob:none
      - name: Select affected tests or full suite shards
        id: scope
        shell: bash
        env:
          ZYRA_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == pull_request ]]; then
            selection=$(cd SOURCE && python3 ../.github/scripts/zyra_test_scope.py "$ZYRA_DIFF_BASE")
          else
            selection='{"mode":"full","tests":[]}'
          fi
          mode=$(jq -er '.mode' <<< "$selection")
          tests=$(jq -ec '.tests' <<< "$selection")
          case "$mode" in
            full) shards='[0,1,2]' ;;
            selected)
              if (( $(jq 'length' <<< "$tests") > 200 )); then
                shards='[0,1,2]'
              else
                shards='[0]'
              fi
              ;;
            none) shards='[0]' ;;
            *) echo 'Unexpected Flutter test selection.' >&2; exit 1 ;;
          esac
          {
            printf 'mode=%s\n' "$mode"
            printf 'tests=%s\n' "$tests"
            printf 'shards=%s\n' "$shards"
          } >> "$GITHUB_OUTPUT"

  flutter:
    name: Flutter checks (shard ${{ matrix.shard }})
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    defaults:
      run:
        working-directory: SOURCE
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Flutter 3.44.2
        shell: bash
        run: |
          archive="$RUNNER_TEMP/flutter_linux_3.44.2-stable.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.2-stable.tar.xz
          printf '%s  %s\n' 'b0de1d19754688ec6769c9a067db3b0594479d3d767f971bfecfc132904c8d5e' "$archive" | sha256sum --check
          tar -xf "$archive" -C "$RUNNER_TEMP"
          # Analyze the guarded iOS wrapper against its pinned upstream import.
          sudo mkdir -p /opt/homebrew/share
          sudo ln -s "$RUNNER_TEMP/flutter" /opt/homebrew/share/flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Set up offline app configuration
        run: |
          cp lib/config/oauth_config.dart.example lib/config/oauth_config.dart
          cp lib/config/supabase_config.dart.example lib/config/supabase_config.dart
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run the assigned Flutter tests
        if: needs.scope.outputs.mode != 'none'
        shell: bash
        # The hosted checkout exercises the existing fail-closed flavor without
        # loading a production backend configuration or OAuth client IDs.
        env:
          ZYRA_TEST_MODE: ${{ needs.scope.outputs.mode }}
          ZYRA_TESTS: ${{ needs.scope.outputs.tests }}
          ZYRA_SHARD: ${{ matrix.shard }}
          ZYRA_SHARDS: ${{ strategy.job-total }}
        run: |
          test_list=$(python3 ../.github/scripts/zyra_test_shard.py \
            "$ZYRA_TEST_MODE" "$ZYRA_TESTS" "$ZYRA_SHARD" "$ZYRA_SHARDS")
          tests=()
          while IFS= read -r path; do tests+=("$path"); done <<< "$test_list"
          flutter test --no-pub --flavor offline-ci --reporter expanded "${tests[@]}"

  full-text-audit:
    name: Full text audit (${{ matrix.label }})
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # Audit failures stay visible in this job's logs but cannot turn the
    # required Flutter checks or the workflow red for a later queue line.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: normal-375-1
            test: test/zyra_clearer_text_contrast_test.dart
            shard_index: 0
            shard_count: 5
          - label: normal-375-2
            test: test/zyra_clearer_text_contrast_test.dart
            shard_index: 1
            shard_count: 5
          - label: normal-375-3
            test: test/zyra_clearer_text_contrast_test.dart
            shard_index: 2
            shard_count: 5
          - label: normal-375-4
            test: test/zyra_clearer_text_contrast_test.dart
            shard_index: 3
            shard_count: 5
          - label: normal-375-5
            test: test/zyra_clearer_text_contrast_test.dart
            shard_index: 4
            shard_count: 5
          - label: normal-430-1
            test: test/zyra_clearer_text_contrast_430_test.dart
            shard_index: 0
            shard_count: 5
          - label: normal-430-2
            test: test/zyra_clearer_text_contrast_430_test.dart
            shard_index: 1
            shard_count: 5
          - label: normal-430-3
            test: test/zyra_clearer_text_contrast_430_test.dart
            shard_index: 2
            shard_count: 5
          - label: normal-430-4
            test: test/zyra_clearer_text_contrast_430_test.dart
            shard_index: 3
            shard_count: 5
          - label: normal-430-5
            test: test/zyra_clearer_text_contrast_430_test.dart
            shard_index: 4
            shard_count: 5
          - label: large-375-1
            test: test/zyra_clearer_text_contrast_large_375_test.dart
            shard_index: 0
            shard_count: 4
          - label: large-375-2
            test: test/zyra_clearer_text_contrast_large_375_test.dart
            shard_index: 1
            shard_count: 4
          - label: large-375-3
            test: test/zyra_clearer_text_contrast_large_375_test.dart
            shard_index: 2
            shard_count: 4
          - label: large-375-4
            test: test/zyra_clearer_text_contrast_large_375_test.dart
            shard_index: 3
            shard_count: 4
          - label: large-430-1
            test: test/zyra_clearer_text_contrast_large_430_test.dart
            shard_index: 0
            shard_count: 5
          - label: large-430-2
            test: test/zyra_clearer_text_contrast_large_430_test.dart
            shard_index: 1
            shard_count: 5
          - label: large-430-3
            test: test/zyra_clearer_text_contrast_large_430_test.dart
            shard_index: 2
            shard_count: 5
          - label: large-430-4
            test: test/zyra_clearer_text_contrast_large_430_test.dart
            shard_index: 3
            shard_count: 5
          - label: large-430-5
            test: test/zyra_clearer_text_contrast_large_430_test.dart
            shard_index: 4
            shard_count: 5
    defaults:
      run:
        working-directory: SOURCE
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Flutter 3.44.2
        shell: bash
        run: |
          archive="$RUNNER_TEMP/flutter_linux_3.44.2-stable.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.2-stable.tar.xz
          printf '%s  %s\n' 'b0de1d19754688ec6769c9a067db3b0594479d3d767f971bfecfc132904c8d5e' "$archive" | sha256sum --check
          tar -xf "$archive" -C "$RUNNER_TEMP"
          sudo mkdir -p /opt/homebrew/share
          sudo ln -s "$RUNNER_TEMP/flutter" /opt/homebrew/share/flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Set up offline app configuration
        run: |
          cp lib/config/oauth_config.dart.example lib/config/oauth_config.dart
          cp lib/config/supabase_config.dart.example lib/config/supabase_config.dart
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run this audit setting and shard
        id: audit
        shell: bash
        env:
          AUDIT_TEST: ${{ matrix.test }}
          AUDIT_SHARD_INDEX: ${{ matrix.shard_index }}
          AUDIT_SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          # Reserve part of the 25-minute job for setup and artifact upload.
          # Named report-only mode retains actual style findings; fixtures stay strict.
          set +e
          timeout --signal=INT --kill-after=15s 20m flutter test \
            --no-pub --flavor offline-ci --reporter expanded \
            --dart-define=ZYRA_FULL_TEXT_AUDIT=true \
            --dart-define=ZYRA_TEXT_AUDIT_ITEM_REPORT=true \
            --dart-define=ZYRA_LINE126_REPORT_ONLY=true \
            "--dart-define=ZYRA_TEXT_AUDIT_HEAD_SHA=$GITHUB_SHA" \
            "--dart-define=ZYRA_TEXT_AUDIT_RUN_ID=$GITHUB_RUN_ID" \
            "--dart-define=ZYRA_TEXT_AUDIT_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
            "--dart-define=ZYRA_TEXT_AUDIT_SHARD_INDEX=$AUDIT_SHARD_INDEX" \
            "--dart-define=ZYRA_TEXT_AUDIT_SHARD_COUNT=$AUDIT_SHARD_COUNT" \
            "$AUDIT_TEST"
          audit_status=$?
          printf 'process_seconds=%s\n' "$SECONDS" >> "$GITHUB_OUTPUT"
          exit "$audit_status"
      - name: Prepare audit report and record result
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          AUDIT_LABEL: ${{ matrix.label }}
          AUDIT_PROCESS_SECONDS: ${{ steps.audit.outputs.process_seconds }}
        run: |
          python3 .github/scripts/zyra_text_audit_proof.py prepare \
            --build SOURCE/build --output "$RUNNER_TEMP/zyra-text-audit" \
            --label "$AUDIT_LABEL" --outcome "$AUDIT_OUTCOME" \
            --process-seconds "${AUDIT_PROCESS_SECONDS:-0}"
          printf 'Full text audit %s: **%s**. Item results and coverage are attached as artifacts.\n' \
            "$AUDIT_LABEL" "$AUDIT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload per-item raster report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zyra-text-audit-${{ matrix.label }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zyra-text-audit/
          if-no-files-found: error

  full-text-audit-proof:
    name: Full text audit (strict union proof)
    needs: full-text-audit
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    # The checker step is strict; unrelated queue lines retain report-only CI.
    # Line 144 requires this actual step conclusion and its proof JSON to pass.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: zyra-text-audit-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zyra-text-audit-shards/
      - name: Collect completed shard job timings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/zyra_text_audit_proof.py jobs \
            --output "$RUNNER_TEMP/zyra-text-audit-proof/jobs.json"
      - name: Prove all four complete corpus unions
        run: |
          python3 .github/scripts/zyra_text_audit_proof.py verify \
            --root "$RUNNER_TEMP/zyra-text-audit-shards" \
            --head "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --jobs "$RUNNER_TEMP/zyra-text-audit-proof/jobs.json" \
            --output "$RUNNER_TEMP/zyra-text-audit-proof/proof.json"
      - name: Upload strict union proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zyra-text-audit-union-proof-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zyra-text-audit-proof/
          if-no-files-found: error
