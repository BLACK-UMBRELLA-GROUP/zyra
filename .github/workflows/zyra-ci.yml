name: ZYRA CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * *'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select Flutter tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      tests: ${{ steps.scope.outputs.tests }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
          # Only checkout-tree blobs are needed by the test selector.
          filter: blob:none
      - name: Select affected tests or full suite shards
        id: scope
        shell: bash
        env:
          ZYRA_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == pull_request ]]; then
            selection=$(cd SOURCE && python3 ../.github/scripts/zyra_test_scope.py "$ZYRA_DIFF_BASE")
          else
            selection='{"mode":"full","tests":[]}'
          fi
          mode=$(jq -er '.mode' <<< "$selection")
          tests=$(jq -ec '.tests' <<< "$selection")
          case "$mode" in
            full) shards='[0,1,2]' ;;
            selected)
              if (( $(jq 'length' <<< "$tests") > 200 )); then
                shards='[0,1,2]'
              else
                shards='[0]'
              fi
              ;;
            none) shards='[0]' ;;
            *) echo 'Unexpected Flutter test selection.' >&2; exit 1 ;;
          esac
          {
            printf 'mode=%s\n' "$mode"
            printf 'tests=%s\n' "$tests"
            printf 'shards=%s\n' "$shards"
          } >> "$GITHUB_OUTPUT"

  flutter:
    name: Flutter checks (shard ${{ matrix.shard }})
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    defaults:
      run:
        working-directory: SOURCE
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Flutter 3.44.2
        shell: bash
        run: |
          archive="$RUNNER_TEMP/flutter_linux_3.44.2-stable.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.2-stable.tar.xz
          printf '%s  %s\n' 'b0de1d19754688ec6769c9a067db3b0594479d3d767f971bfecfc132904c8d5e' "$archive" | sha256sum --check
          tar -xf "$archive" -C "$RUNNER_TEMP"
          # Analyze the guarded iOS wrapper against its pinned upstream import.
          sudo mkdir -p /opt/homebrew/share
          sudo ln -s "$RUNNER_TEMP/flutter" /opt/homebrew/share/flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Set up offline app configuration
        run: |
          cp lib/config/oauth_config.dart.example lib/config/oauth_config.dart
          cp lib/config/supabase_config.dart.example lib/config/supabase_config.dart
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run the assigned Flutter tests
        if: needs.scope.outputs.mode != 'none'
        shell: bash
        # The hosted checkout exercises the existing fail-closed flavor without
        # loading a production backend configuration or OAuth client IDs.
        env:
          ZYRA_TEST_MODE: ${{ needs.scope.outputs.mode }}
          ZYRA_TESTS: ${{ needs.scope.outputs.tests }}
          ZYRA_SHARD: ${{ matrix.shard }}
          ZYRA_SHARDS: ${{ strategy.job-total }}
        run: |
          test_list=$(python3 ../.github/scripts/zyra_test_shard.py \
            "$ZYRA_TEST_MODE" "$ZYRA_TESTS" "$ZYRA_SHARD" "$ZYRA_SHARDS")
          tests=()
          while IFS= read -r path; do tests+=("$path"); done <<< "$test_list"
          flutter test --no-pub --flavor offline-ci --reporter expanded "${tests[@]}"

  full-text-audit:
    name: Full text audit (${{ matrix.label }})
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # Audit failures stay visible in this job's logs but cannot turn the
    # required Flutter checks or the workflow red for a later queue line.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: normal-375
            test: test/zyra_clearer_text_contrast_test.dart
            shard_index: 0
            shard_count: 1
          - label: normal-430
            test: test/zyra_clearer_text_contrast_430_test.dart
            shard_index: 0
            shard_count: 1
          - label: large-375-1
            test: test/zyra_clearer_text_contrast_large_375_test.dart
            shard_index: 0
            shard_count: 4
          - label: large-375-2
            test: test/zyra_clearer_text_contrast_large_375_test.dart
            shard_index: 1
            shard_count: 4
          - label: large-375-3
            test: test/zyra_clearer_text_contrast_large_375_test.dart
            shard_index: 2
            shard_count: 4
          - label: large-375-4
            test: test/zyra_clearer_text_contrast_large_375_test.dart
            shard_index: 3
            shard_count: 4
          - label: large-430
            test: test/zyra_clearer_text_contrast_large_430_test.dart
            shard_index: 0
            shard_count: 1
    defaults:
      run:
        working-directory: SOURCE
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Flutter 3.44.2
        shell: bash
        run: |
          archive="$RUNNER_TEMP/flutter_linux_3.44.2-stable.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.2-stable.tar.xz
          printf '%s  %s\n' 'b0de1d19754688ec6769c9a067db3b0594479d3d767f971bfecfc132904c8d5e' "$archive" | sha256sum --check
          tar -xf "$archive" -C "$RUNNER_TEMP"
          sudo mkdir -p /opt/homebrew/share
          sudo ln -s "$RUNNER_TEMP/flutter" /opt/homebrew/share/flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Set up offline app configuration
        run: |
          cp lib/config/oauth_config.dart.example lib/config/oauth_config.dart
          cp lib/config/supabase_config.dart.example lib/config/supabase_config.dart
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run this audit setting and shard
        id: audit
        shell: bash
        env:
          AUDIT_TEST: ${{ matrix.test }}
          AUDIT_SHARD_INDEX: ${{ matrix.shard_index }}
          AUDIT_SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          # Reserve part of the 25-minute job for setup and artifact upload.
          timeout --signal=INT --kill-after=15s 20m flutter test \
            --no-pub --flavor offline-ci --reporter expanded \
            --dart-define=ZYRA_FULL_TEXT_AUDIT=true \
            --dart-define=ZYRA_TEXT_AUDIT_ITEM_REPORT=true \
            "--dart-define=ZYRA_TEXT_AUDIT_SHARD_INDEX=$AUDIT_SHARD_INDEX" \
            "--dart-define=ZYRA_TEXT_AUDIT_SHARD_COUNT=$AUDIT_SHARD_COUNT" \
            "$AUDIT_TEST"
      - name: Prepare audit report and record result
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          AUDIT_LABEL: ${{ matrix.label }}
        run: |
          report_dir="$RUNNER_TEMP/zyra-text-audit"
          mkdir -p "$report_dir"
          shopt -s nullglob
          frames=(SOURCE/build/line126-rebuild-contrast-*-items.jsonl)
          reports=(SOURCE/build/line126-rebuild-contrast-*.json)
          report=''
          completed=false
          for candidate in "${reports[@]}"; do
            jq -e 'type == "object"' "$candidate" > /dev/null || continue
            report="$candidate"
            if [[ "$candidate" != *-progress.json ]]; then
              completed=true
              break
            fi
          done
          if (( ${#frames[@]} == 1 )); then
            if ! jq -s '.' "${frames[0]}" > "$report_dir/items.json"; then
              # Recover complete frame records if a deadline cut an append short.
              jq -Rs 'split("\n") | map(try fromjson catch empty)' \
                "${frames[0]}" > "$report_dir/items.json"
            fi
          else
            printf '[]\n' > "$report_dir/items.json"
          fi
          if [[ -n "$report" ]]; then
            cp "$report" "$report_dir/audit.json"
            jq --argjson complete "$completed" --arg outcome "$AUDIT_OUTCOME" \
              '{setting, shard_index, shard_count, frames, coverage_gaps,
                complete: $complete, audit_outcome: $outcome}' \
              "$report" > "$report_dir/coverage.json"
          else
            jq -n --arg label "$AUDIT_LABEL" --arg outcome "$AUDIT_OUTCOME" \
              '{label: $label, complete: false, audit_outcome: $outcome,
                reason: "No raster report was written"}' > "$report_dir/coverage.json"
          fi
          printf 'Full text audit %s: **%s**. Item results and coverage are attached as artifacts.\n' \
            "$AUDIT_LABEL" "$AUDIT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload per-item raster report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zyra-text-audit-${{ matrix.label }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zyra-text-audit/
          if-no-files-found: error

  large-375-coverage:
    name: Full text audit (large-375 combined coverage)
    needs: full-text-audit
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: zyra-text-audit-large-375-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zyra-large-375/
      - name: Check that the shards cover the whole corpus
        shell: bash
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/zyra-large-375/*/coverage.json)
          if (( ${#reports[@]} != 4 )); then
            echo 'Expected all four large-375 coverage reports.' >&2
            exit 1
          fi
          jq -es '
            all(.[]; .setting == "large-375" and .shard_count == 4
              and .complete and .frames > 0 and (.coverage_gaps | type == "array"))
            and (map(.shard_index) | sort == [0, 1, 2, 3])
          ' "${reports[@]}"
          # An obligation is uncovered only when every shard reports that gap.
          missing=$(jq -cs '[.[].coverage_gaps | unique[]] | group_by(.) |
            map(select(length == 4) | .[0])' "${reports[@]}")
          if [[ "$missing" != '[]' ]]; then
            printf 'Large-375 coverage gaps: %s\n' "$missing" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          echo 'All large-375 coverage obligations were measured across four shards.' >> "$GITHUB_STEP_SUMMARY"
