name: ZYRA CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * *'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select Flutter tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      tests: ${{ steps.scope.outputs.tests }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
          # Only checkout-tree blobs are needed by the test selector.
          filter: blob:none
      - name: Select affected tests or full suite shards
        id: scope
        shell: bash
        env:
          ZYRA_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == pull_request ]]; then
            selection=$(cd SOURCE && python3 ../.github/scripts/zyra_test_scope.py "$ZYRA_DIFF_BASE")
          else
            selection='{"mode":"full","tests":[]}'
          fi
          mode=$(jq -er '.mode' <<< "$selection")
          tests=$(jq -ec '.tests' <<< "$selection")
          case "$mode" in
            full) shards='[0,1,2]' ;;
            selected)
              if (( $(jq 'length' <<< "$tests") > 200 )); then
                shards='[0,1,2]'
              else
                shards='[0]'
              fi
              ;;
            none) shards='[0]' ;;
            *) echo 'Unexpected Flutter test selection.' >&2; exit 1 ;;
          esac
          {
            printf 'mode=%s\n' "$mode"
            printf 'tests=%s\n' "$tests"
            printf 'shards=%s\n' "$shards"
          } >> "$GITHUB_OUTPUT"

  flutter:
    name: Flutter checks (shard ${{ matrix.shard }})
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    defaults:
      run:
        working-directory: SOURCE
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Flutter 3.44.2
        shell: bash
        run: |
          archive="$RUNNER_TEMP/flutter_linux_3.44.2-stable.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.2-stable.tar.xz
          printf '%s  %s\n' 'b0de1d19754688ec6769c9a067db3b0594479d3d767f971bfecfc132904c8d5e' "$archive" | sha256sum --check
          tar -xf "$archive" -C "$RUNNER_TEMP"
          # Analyze the guarded iOS wrapper against its pinned upstream import.
          sudo mkdir -p /opt/homebrew/share
          sudo ln -s "$RUNNER_TEMP/flutter" /opt/homebrew/share/flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Set up offline app configuration
        run: |
          cp lib/config/oauth_config.dart.example lib/config/oauth_config.dart
          cp lib/config/supabase_config.dart.example lib/config/supabase_config.dart
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run the assigned Flutter tests
        if: needs.scope.outputs.mode != 'none'
        shell: bash
        # The hosted checkout exercises the existing fail-closed flavor without
        # loading a production backend configuration or OAuth client IDs.
        env:
          ZYRA_TEST_MODE: ${{ needs.scope.outputs.mode }}
          ZYRA_TESTS: ${{ needs.scope.outputs.tests }}
          ZYRA_SHARD: ${{ matrix.shard }}
          ZYRA_SHARDS: ${{ strategy.job-total }}
        run: |
          test_list=$(python3 ../.github/scripts/zyra_test_shard.py \
            "$ZYRA_TEST_MODE" "$ZYRA_TESTS" "$ZYRA_SHARD" "$ZYRA_SHARDS")
          tests=()
          while IFS= read -r path; do tests+=("$path"); done <<< "$test_list"
          flutter test --no-pub --flavor offline-ci --reporter expanded "${tests[@]}"
