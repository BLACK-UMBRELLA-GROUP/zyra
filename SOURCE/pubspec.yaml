name: zyra
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # ZYRA UI dependencies (added 2026-07-18, resuming ZYRA — OA-AIOS-289)
  google_fonts: ^6.2.1   # Jost typeface — per ZYRA typography spec

  # Backend (OA-101/102, DR-073) — added once Supabase project details
  # are available. Safe to add before the project exists: initialization
  # is skipped until lib/config/supabase_config.dart has real values.
  supabase_flutter: ^2.8.0

  # OA-104 — real device photo picking for the Chapter 2 Photos step,
  # replacing the mock 6-photo picsum pool.
  image_picker: ^1.1.2

  # Auth (2026-07-18) — Google + Apple native sign-in ONLY, per Founder
  # instruction: no password, no email login, no phone login. Both
  # produce an ID token exchanged with Supabase via signInWithIdToken
  # (lib/services/zyra_auth.dart) rather than a browser OAuth redirect.
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.5 # nonce hashing for the Apple Sign-In flow

  # 2026-08-01 — promoted from transitive to direct.
  #
  # supabase_flutter already depended on this to persist the auth session,
  # so it was in pubspec.lock and shipping in every build. Declaring it
  # directly downloads nothing new; it stops lib/services/zyra_local_prefs
  # .dart relying on another package's transitive tree, which would break
  # silently on a Supabase version bump.
  #
  # Used ONLY to cache the Seeker's gender so the first frame paints the
  # right gradient without a network round trip (Founder: "I don't want to
  # see that quick colour change at all"). Not a local database — see that
  # file's scope rule.
  shared_preferences: ^2.5.5

  # App Lock — 2026-08-07, Founder: "For ZYRA I think this becomes a
  # selling point, not just a privacy option."
  #
  # Face ID / Touch ID / Android biometrics, with the DEVICE PASSCODE as
  # the fallback (biometricOnly: false). ZYRA stores no PIN and no secret
  # of its own — see lib/services/zyra_app_lock.dart for why that matters
  # more than it sounds. Costs nothing: this is the OS's own
  # authentication, not a paid service.
  #
  # NATIVE CONFIGURATION IS REQUIRED and is easy to miss, because the Dart
  # side compiles perfectly without it and then fails on a real device:
  #   iOS      NSFaceIDUsageDescription in ios/Runner/Info.plist, or the
  #            app is REJECTED at review and crashes on first Face ID use.
  #   Android  MainActivity must extend FlutterFragmentActivity, not
  #            FlutterActivity — the biometric prompt is a Fragment and
  #            throws at runtime otherwise. Both are done.
  local_auth: ^2.3.0
  # Reads the app version and build number from the platform bundle so the
  # footer in Settings cannot drift from pubspec. Added 2026-08-09.
  # Checked against this project's SDK before adding: package_info_plus
  # 10.2.1 needs Flutter >=3.38.1 / Dart >=3.10.0; pubspec.lock records
  # Dart 3.12.2 and Flutter 3.44.0. No tracking, no network.
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates real app icons (macOS/iOS/Android/web) from
  # assets/icon/icon.png, replacing the stock Flutter icon. Added
  # 2026-07-18 — see flutter_launcher_icons config below and
  # BUSINESS/APP LOGO/Summary.md (source image is a PLACEHOLDER: two
  # interlocking rings on purple, per that doc's "Current Leading Logo
  # Concept" — the doc's own to-do list still says the official logo
  # isn't finalised, so swap assets/icon/icon.png for the real one
  # later and rerun `dart run flutter_launcher_icons`).
  flutter_launcher_icons: ^0.14.3

  # Generates native splash screens (iOS/Android/web) from assets/
  # splash/ — added 2026-07-18 alongside the Google/Apple-only auth
  # rework. See flutter_native_splash config below.
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  web:
    generate: true
  image_path: "assets/icon/icon.png"

# Native splash screen — added 2026-07-18. Background is the dark end
# of ZyraColors.brandGradient (0xFF3D2A4A); native splash can only
# render a solid colour, not a gradient, so this is the closest single
# colour to that gradient's anchor tone, already used as a solid
# fallback background elsewhere in the app (e.g. AuthGate's loading
# state). The image is the "ZYRA" wordmark rendered as a static PNG —
# see assets/splash/splash_logo.png's own note on the font substitute
# used (this sandbox has no network access to fetch the real Playfair
# Display font file the live app uses via google_fonts; Liberation
# Serif Bold was used as a close local stand-in for this one static
# asset only — everything else in the running app renders with the
# real Playfair Display / Jost fonts via google_fonts as normal).
# Regenerate with the real Playfair Display TTF for a pixel-exact
# match whenever convenient — not urgent, the difference is minor at
# splash-flash duration.
# NATIVE SPLASH — IMAGE REMOVED 2026-08-07, and it must stay removed.
#
# This used to paint the ZYRA wordmark. Now that the in-app splash animates
# the letters in one at a time (lib/screens/splash_screen.dart, Founder-
# approved), an assembled wordmark here means the user sees the name whole,
# then watches it vanish and rebuild itself. The launch image is the ONLY
# thing on screen before Flutter draws, so it cannot be fixed from Dart.
#
# A flat colour instead. It shows for a fraction of a second and hands over
# to a screen that starts on the same colour, so the join is invisible —
# which is the whole reason the animation opens on brand purple rather than
# on black or on one of the gender palettes.
#
# assets/splash/splash_logo.png is left in the repo but is NO LONGER
# REFERENCED. It is the Syne wordmark at 1400x460 on transparent, kept
# because it is the right asset if a static launch image is ever wanted
# again — at which point the letter-by-letter animation has to go.
flutter_native_splash:
  color: "#3D2A4A"
  android_12:
    color: "#3D2A4A"
  web: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icon/icon.png
    - assets/splash/splash_logo.png
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
